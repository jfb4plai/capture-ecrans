name: Capture d'écran PLAI - version Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publier une version (ex. v1.1.0). Laisser vide pour une simple construction de test."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write   # nécessaire pour publier la release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt python-docx
      - run: python -m pytest -q tests
      # ffmpeg LGPL (vidéo) : refus automatique d'un build GPL ; licence et sources copiées avec le programme
      - run: python tools/fetch_ffmpeg.py
      # --onedir (dossier) plutôt que --onefile : moins de faux positifs d'antivirus et démarrage plus rapide
      - run: >
          pyinstaller --noconfirm --onedir --windowed --name Capture-ecran-PLAI
          --icon capture_ecran/assets/icon.ico
          --add-data "capture_ecran/assets;capture_ecran/assets"
          lanceur.py
      - name: Ajouter ffmpeg (LGPL), sa licence et ses sources au dossier du programme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Capture-ecran-PLAI/ffmpeg | Out-Null
          Copy-Item vendor/ffmpeg/* dist/Capture-ecran-PLAI/ffmpeg/
          Copy-Item THIRD_PARTY_NOTICES.txt dist/Capture-ecran-PLAI/
      - name: Test de démarrage de l'exécutable construit
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist/Capture-ecran-PLAI/Capture-ecran-PLAI.exe" -ArgumentList "--selftest", $out -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out)) {
            if (Test-Path "$env:LOCALAPPDATA/CaptureEcranPLAI/erreur.log") { Get-Content "$env:LOCALAPPDATA/CaptureEcranPLAI/erreur.log" }
            throw "L'exécutable ne démarre pas (code $($p.ExitCode))"
          }
          Get-Content $out
      - name: Ajouter le mode d'emploi et la licence au dossier du programme
        shell: pwsh
        run: |
          Copy-Item capture_ecran/assets/mode-emploi.html dist/Capture-ecran-PLAI/Mode-emploi.html
          Copy-Item LICENSE dist/Capture-ecran-PLAI/
      - name: Construire l'installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup introuvable" }
          $ver = (Select-String -Path capture_ecran/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$ver" installer/capture-ecran.iss
          if ($LASTEXITCODE -ne 0) { throw "Échec de la compilation de l'installateur" }
          Get-Item installateur/Capture-ecran-PLAI-installateur.exe | Format-List Name, Length
      # Installation silencieuse dans un dossier de test, démarrage de la version INSTALLÉE, puis désinstallation.
      - name: Tester l'installateur (installer, démarrer, réinstaller par-dessus, désinstaller)
        shell: pwsh
        run: |
          $setup = (Resolve-Path installateur/Capture-ecran-PLAI-installateur.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP "install-test"
          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$dir", "/TASKS=")
          $p = Start-Process $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation : code $($p.ExitCode)" }
          $exe = Join-Path $dir "Capture-ecran-PLAI.exe"
          if (-not (Test-Path $exe)) { throw "Programme absent après installation" }
          if (-not (Test-Path (Join-Path $dir "Mode-emploi.html"))) { throw "Mode d'emploi absent" }
          $out = Join-Path $env:RUNNER_TEMP "selftest-installe.txt"
          $r = Start-Process $exe -ArgumentList "--selftest", $out -Wait -PassThru
          if ($r.ExitCode -ne 0 -or -not (Test-Path $out)) { throw "La version installée ne démarre pas" }
          Get-Content $out
          # mise à jour : réinstaller par-dessus ne doit pas échouer ni dupliquer l'entrée de désinstallation
          $p = Start-Process $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Réinstallation par-dessus : code $($p.ExitCode)" }
          $unins = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $unins) { throw "Désinstalleur absent" }
          $p = Start-Process $unins.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }   # le désinstalleur se relance en copie temporaire
          if (Test-Path $exe) { throw "Le programme est encore là après désinstallation" }
          "Installation, démarrage, mise à jour par-dessus et désinstallation : OK"
      - name: Préparer l'archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Capture-ecran-PLAI -DestinationPath Capture-ecran-PLAI-windows.zip
          $h = (Get-FileHash Capture-ecran-PLAI-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Capture-ecran-PLAI-windows.zip" | Out-File -Encoding ascii Capture-ecran-PLAI-windows.zip.sha256
          $hi = (Get-FileHash installateur/Capture-ecran-PLAI-installateur.exe -Algorithm SHA256).Hash.ToLower()
          "$hi  Capture-ecran-PLAI-installateur.exe" | Out-File -Encoding ascii Capture-ecran-PLAI-installateur.exe.sha256
          Get-Content Capture-ecran-PLAI-windows.zip.sha256, Capture-ecran-PLAI-installateur.exe.sha256
      # Analyse par le vrai Microsoft Defender du serveur Windows. Le texte de sortie décide du statut
      # (« found no threats » / « found N threats ») plutôt que le code de sortie, ambigu selon les versions.
      - name: Analyse Microsoft Defender
        shell: pwsh
        continue-on-error: true
        run: |
          $status = "NON_CONCLUANT"; $detail = ""
          try {
            $folder = (Resolve-Path "dist/Capture-ecran-PLAI").Path
            $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
            if (-not (Test-Path $mp)) { throw "MpCmdRun.exe introuvable sur ce serveur" }
            try { & $mp -SignatureUpdate 2>&1 | Out-Null } catch { }
            try {
              $st = Get-MpComputerStatus
              $detail = "Moteur Defender $($st.AMProductVersion), signatures $($st.AntivirusSignatureVersion) (mises à jour le $($st.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC)`n"
            } catch { $detail = "Version des signatures indisponible`n" }
            $out = (& $mp -Scan -ScanType 3 -File $folder -DisableRemediation 2>&1 | Out-String).Trim()
            $detail += "Dossier analysé : Capture-ecran-PLAI (programme et bibliothèques)`n$out"
            $inst = (Resolve-Path "installateur/Capture-ecran-PLAI-installateur.exe").Path
            $out2 = (& $mp -Scan -ScanType 3 -File $inst -DisableRemediation 2>&1 | Out-String).Trim()
            $detail += "`n`nInstallateur analysé : Capture-ecran-PLAI-installateur.exe`n$out2"
            if ($out -match "found no threats" -and $out2 -match "found no threats") { $status = "PROPRE" }
            elseif (($out + $out2) -match "found \d+ threat") { $status = "MENACE" }
          } catch { $detail = "Analyse impossible : $($_.Exception.Message)" }
          "STATUT: $status`n$detail" | Out-File -Encoding utf8 scan-defender.txt
          Get-Content scan-defender.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Capture-ecran-PLAI-windows
          path: |
            Capture-ecran-PLAI-windows.zip
            Capture-ecran-PLAI-windows.zip.sha256
            Capture-ecran-PLAI-installateur.exe.sha256
            installateur/Capture-ecran-PLAI-installateur.exe
            scan-defender.txt

  scan-linux:
    runs-on: ubuntu-latest
    needs: build
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}   # facultatif : sans clé, VirusTotal est simplement ignoré
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Capture-ecran-PLAI-windows
          path: pkg
      - name: Analyse ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav unzip > /dev/null
          sudo systemctl stop clamav-freshclam 2> /dev/null || true
          sudo freshclam --quiet || echo "Mise à jour des signatures impossible : signatures installées utilisées"
          mkdir x && unzip -q pkg/Capture-ecran-PLAI-windows.zip -d x
          cp pkg/installateur/Capture-ecran-PLAI-installateur.exe x/
          ver="$(clamscan --version)"
          set +e
          out="$(clamscan -r --infected x 2>&1)"
          code=$?
          set -e
          case $code in 0) st=PROPRE;; 1) st=MENACE;; *) st=NON_CONCLUANT;; esac
          { echo "STATUT: $st"; echo "$ver"; echo "$out"; } > scan-clamav.txt
          cat scan-clamav.txt
      - name: Analyse VirusTotal (si une clé est configurée)
        if: ${{ env.VT_API_KEY != '' }}
        continue-on-error: true
        run: python3 tools/virustotal.py pkg/Capture-ecran-PLAI-windows.zip scan-virustotal.txt
      - uses: actions/upload-artifact@v4
        with:
          name: analyses-linux
          path: |
            scan-clamav.txt
            scan-virustotal.txt
          if-no-files-found: ignore

  rapport:
    runs-on: ubuntu-latest
    needs: [build, scan-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Nom de la version
        id: ver
        run: |
          v="${{ inputs.version || github.ref_name }}"
          if [ -n "${{ inputs.version }}" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Nom de version invalide : $v (attendu : v1.2.3)"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Rapport d'analyse de sécurité
        run: |
          cat art/Capture-ecran-PLAI-windows/*.sha256 > art/Capture-ecran-PLAI-windows/all.sha256
          vt=""; [ -f art/analyses-linux/scan-virustotal.txt ] && vt="--vt art/analyses-linux/scan-virustotal.txt"
          python3 tools/scan_report.py --version "${{ steps.ver.outputs.name }}" \
            --sha art/Capture-ecran-PLAI-windows/all.sha256 \
            --defender art/Capture-ecran-PLAI-windows/scan-defender.txt \
            --clamav art/analyses-linux/scan-clamav.txt $vt --out SECURITY-REPORT.md
          cat SECURITY-REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-securite
          path: SECURITY-REPORT.md
      # Publication seulement si le rapport ne signale aucune menace (le script échoue sinon)
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Capture d'écran PLAI ${{ steps.ver.outputs.name }}
          make_latest: true
          prerelease: false
          body_path: SECURITY-REPORT.md
          files: |
            art/Capture-ecran-PLAI-windows/installateur/Capture-ecran-PLAI-installateur.exe
            art/Capture-ecran-PLAI-windows/Capture-ecran-PLAI-windows.zip
            SECURITY-REPORT.md
